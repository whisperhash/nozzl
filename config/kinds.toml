# The event kinds nozzl acquires. Hot-reloaded: adding a kind starts a backfill
# of it on every relay it reaches, without a restart. A kind reaches a relay
# when the relay's `only_kinds` (relays.toml) admits the kind and the kind's
# own `only_relays` admits the relay.
#
# This holds every kind nostrology-data reads, plus a few it does not read yet.
# Kinds are grouped by domain, in the order nostrolo.gy lists its domains.
# General-purpose kinds come last, each with the domains that read it.
#
# `slug` is required. It names the kind in metric labels and logs and is not
# part of the archive layout (`c={class}/k={kind}/...`). A slug must match
# `^[a-z0-9][a-z0-9-]*$` and be at most 63 bytes.

# --- Zapstore ----------------------------------------------------------------

# Zapstore software assets: the checksum and binary anchors that
# kind-30063 (zapstore-app-releases) references. Regular.
[[kind]]
k = 3063
slug = "zapstore-asset-metadata"

# Zapstore app releases. Addressable.
[[kind]]
k = 30063
slug = "zapstore-app-releases"

# Zapstore app stacks. Addressable.
[[kind]]
k = 30267
slug = "zapstore-app-stacks"

# Zapstore app catalog. Addressable.
[[kind]]
k = 32267
slug = "zapstore-app-catalog"

# --- Marketplaces ------------------------------------------------------------

# NIP-99 classified listing: the core marketplace record. Addressable.
[[kind]]
k = 30402
slug = "markets-product-listings"

# Product collection, a storefront grouping. From the GammaMarkets market spec,
# not NIP-99 itself. Addressable.
[[kind]]
k = 30405
slug = "markets-collections"

# Shipping option, which listings reference. From the GammaMarkets market spec,
# in the NIP-99 number range but not in the NIP. Addressable.
[[kind]]
k = 30406
slug = "markets-shipping-options"

