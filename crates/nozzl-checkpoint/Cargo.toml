[package]
name = "nozzl-checkpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nozzl-types = { path = "../nozzl-types" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
# umask(2) for the checkpoint-permissions umask-independence test. std exposes no
# umask, and the property under test (0644 regardless of umask) can only be
# proven by flushing under a hostile umask.
libc = "0.2"
